<!doctype html><html lang="ko"><meta charset="utf-8"><style>:root{color-scheme:dark;--background:#08090a;--foreground:#f7f8f8;--muted:rgba(255,255,255,.12);--muted-foreground:#8a8f98;--surface-primary:rgba(255,255,255,.05);--border:rgba(255,255,255,.14);--radius:12px}html{background:#08090a;color:var(--foreground);font:14px/1.5 system-ui,sans-serif}body{margin:24px;max-width:760px}
